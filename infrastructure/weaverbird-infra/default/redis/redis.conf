# Redis Configuration for WeaverBird AIM

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice

# Timeout
timeout 0
tcp-keepalive 300

# Databases (use different DBs for different purposes)
# DB 0: General cache
# DB 1: Sessions
# DB 2: Rate limiting
# DB 3: Real-time/presence
# DB 4: Notification delivery
databases 16
