name: infrastructure-weaverbird-infra-default

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - infra-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  spicedb-migrate:
    image: authzed/spicedb:v1.38.0
    restart: on-failure:5
    command: >
      datastore migrate head
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-private

  spicedb:
    image: authzed/spicedb:v1.38.0
    restart: unless-stopped
    command: >
      serve
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable
      --grpc-preshared-key=${SPICEDB_GRPC_PRESHARED_KEY}
      --http-enabled=true
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  spicedb-schema-load:
    image: alpine:3.19
    restart: on-failure:3
    volumes:
      - ./spicedb/schema.zed:/schema.zed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        apk add --no-cache curl jq >/dev/null 2>&1

        READY=false
        for i in $$(seq 1 30); do
          if curl -sf http://spicedb:8443/healthz >/dev/null 2>&1; then
            READY=true
            break
          fi
          sleep 2
        done

        if [ "$$READY" != "true" ]; then
          echo "ERROR: SpiceDB never became live" >&2
          exit 1
        fi

        SCHEMA=$$(jq -Rs . < /schema.zed)
        HTTP_CODE=$$(curl -s -o /tmp/response.json -w '%{http_code}' \
          -X POST "http://spicedb:8443/v1/schema/write" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $${SPICEDB_TOKEN}" \
          -d "{\"schema\": $${SCHEMA}}")

        if [ "$$HTTP_CODE" -lt 200 ] || [ "$$HTTP_CODE" -ge 300 ]; then
          echo "ERROR: schema write failed with HTTP $$HTTP_CODE" >&2
          cat /tmp/response.json >&2
          exit 1
        fi
    environment:
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY}
    depends_on:
      spicedb:
        condition: service_healthy
    networks:
      - infra-private

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: 'master -ip=seaweedfs-master -ip.bind=0.0.0.0 -metricsPort=9324'
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: 'volume -mserver="seaweedfs-master:9333" -ip.bind=0.0.0.0 -port=8082 -metricsPort=9325'
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: 'filer -master="seaweedfs-master:9333" -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    volumes:
      - seaweedfs_filer_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  infra-private:
    external: true

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  mailpit_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
