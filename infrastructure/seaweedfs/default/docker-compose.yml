name: infrastructure-seaweedfs-default

services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    restart: unless-stopped
    command: 'master -ip=seaweedfs-master -ip.bind=0.0.0.0 -metricsPort=9324'
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    restart: unless-stopped
    command: 'volume -mserver="seaweedfs-master:9333" -ip.bind=0.0.0.0 -port=8082 -metricsPort=9325'
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    restart: unless-stopped
    command: 'filer -master="seaweedfs-master:9333" -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    volumes:
      - seaweedfs_filer_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    networks:
      - infra-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  infra-private:
    external: true

volumes:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
