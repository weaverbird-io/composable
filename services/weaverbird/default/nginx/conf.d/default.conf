server {
    listen 80;
    server_name _;

    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost:3000|localhost:3001)$") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-User-ID, X-Request-ID, X-API-Key, X-WB-Subject, X-WB-App" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Vary "Origin" always;

    location /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"weaverbird"}';
        add_header Content-Type application/json;
    }

    location /ready {
        access_log off;
        return 200 '{"status":"ready"}';
        add_header Content-Type application/json;
    }

    location = /_auth/validate {
        internal;
        proxy_pass http://auth_service/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /notifications {
        return 301 /notifications/;
    }

    location /notifications/ {
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_auth/validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_wb_subject $upstream_http_x_wb_subject;
        auth_request_set $auth_wb_app $upstream_http_x_wb_app;

        error_page 401 = @auth_401;
        error_page 403 = @auth_403;

        set $notification_upstream http://notification-service:8083;
        proxy_pass $notification_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-WB-Subject $auth_wb_subject;
        proxy_set_header X-WB-App $auth_wb_app;
    }

    location /preferences {
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_auth/validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_wb_subject $upstream_http_x_wb_subject;
        auth_request_set $auth_wb_app $upstream_http_x_wb_app;

        error_page 401 = @auth_401;
        error_page 403 = @auth_403;

        set $notification_upstream http://notification-service:8083;
        proxy_pass $notification_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-WB-Subject $auth_wb_subject;
        proxy_set_header X-WB-App $auth_wb_app;
    }

    location = /audit-logs {
        return 301 /audit-logs/;
    }

    location /audit-logs/ {
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_auth/validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_wb_subject $upstream_http_x_wb_subject;
        auth_request_set $auth_wb_app $upstream_http_x_wb_app;

        error_page 401 = @auth_401;
        error_page 403 = @auth_403;

        set $audit_upstream http://audit-service:8085;
        proxy_pass $audit_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-WB-Subject $auth_wb_subject;
        proxy_set_header X-WB-App $auth_wb_app;
    }

    location ~ ^/credentials(?:/|$) {
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_auth/validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_wb_subject $upstream_http_x_wb_subject;
        auth_request_set $auth_wb_app $upstream_http_x_wb_app;

        error_page 401 = @auth_401;
        error_page 403 = @auth_403;

        set $credential_upstream http://credential-service:8086;
        proxy_pass $credential_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-WB-Subject $auth_wb_subject;
        proxy_set_header X-WB-App $auth_wb_app;
    }

    location @auth_401 {
        return 401 '{"error":"unauthorized"}';
        add_header Content-Type application/json;
    }

    location @auth_403 {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json;
    }

    # Route everything else to auth frontend to keep a single domain entrypoint
    location / {
        proxy_pass http://auth-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
