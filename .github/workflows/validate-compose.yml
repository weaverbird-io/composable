name: Validate Docker Compose Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate and fix compose names
        run: |
          python3 << 'EOF'
          import os
          import yaml
          import sys

          def get_expected_name(filepath):
              """Generate name from directory path: infrastructure/traefik/default -> infrastructure-traefik-default"""
              # Get path relative to repo root, excluding docker-compose.yml
              rel_path = os.path.dirname(filepath)
              # Remove leading ./ if present
              rel_path = rel_path.lstrip('./')
              # Replace / with - to create name
              return rel_path.replace('/', '-').replace('\\', '-')

          def find_compose_files():
              """Find all docker-compose.yml files"""
              compose_files = []
              for root, dirs, files in os.walk('.'):
                  # Skip hidden directories
                  dirs[:] = [d for d in dirs if not d.startswith('.')]
                  for f in files:
                      if f == 'docker-compose.yml' or f.startswith('docker-compose.') and f.endswith('.yml'):
                          compose_files.append(os.path.join(root, f))
              return compose_files

          def validate_compose(filepath):
              """Validate a compose file has correct name field"""
              with open(filepath, 'r') as f:
                  try:
                      content = yaml.safe_load(f)
                  except yaml.YAMLError as e:
                      return False, f"Invalid YAML: {e}"

              if content is None:
                  return False, "Empty file"

              # Check for deprecated version field
              if 'version' in content:
                  return False, "Contains deprecated 'version' field - please remove it"

              # Check for name field
              if 'name' not in content:
                  return False, "Missing 'name' field"

              expected_name = get_expected_name(filepath)
              actual_name = content.get('name', '')

              if actual_name != expected_name:
                  return False, f"Name mismatch: expected '{expected_name}', got '{actual_name}'"

              return True, "OK"

          def main():
              compose_files = find_compose_files()
              print(f"Found {len(compose_files)} docker-compose file(s)\n")

              errors = []
              names_seen = {}

              for filepath in compose_files:
                  print(f"Checking: {filepath}")
                  valid, message = validate_compose(filepath)

                  if valid:
                      print(f"  ✓ {message}")
                      # Check for duplicate names
                      with open(filepath, 'r') as f:
                          content = yaml.safe_load(f)
                      name = content.get('name', '')
                      if name in names_seen:
                          errors.append(f"{filepath}: Duplicate name '{name}' (also in {names_seen[name]})")
                          print(f"  ✗ Duplicate name")
                      else:
                          names_seen[name] = filepath
                  else:
                      print(f"  ✗ {message}")
                      errors.append(f"{filepath}: {message}")

              print()
              if errors:
                  print("Errors found:")
                  for error in errors:
                      print(f"  - {error}")
                  sys.exit(1)
              else:
                  print("All compose files are valid!")
                  sys.exit(0)

          if __name__ == '__main__':
              main()
          EOF

      - name: Update registry.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 << 'EOF'
          import os
          import json
          import re
          import yaml

          def find_compose_files():
              compose_files = []
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if not d.startswith('.')]
                  for f in files:
                      if f == 'docker-compose.yml':
                          compose_files.append(os.path.join(root, f))
              return compose_files

          def parse_compose(filepath):
              with open(filepath, 'r') as f:
                  content = yaml.safe_load(f)

              rel_path = os.path.dirname(filepath).lstrip('./')
              name = content.get('name', '')

              # Determine category from path
              if rel_path.startswith('infrastructure/'):
                  category = 'infrastructure'
              elif rel_path.startswith('services/'):
                  category = 'services'
              else:
                  return None

              # Get ports from compose
              def parse_port_token(token):
                  if token is None:
                      return None

                  token = str(token).strip().strip('"').strip("'")
                  if not token:
                      return None

                  # Drop protocol suffix, e.g. 51820/udp -> 51820
                  token = token.split('/', 1)[0]

                  # Plain numeric port
                  if token.isdigit():
                      return int(token)

                  # Port range, e.g. 8000-8005 -> 8000
                  if '-' in token:
                      start = token.split('-', 1)[0]
                      if start.isdigit():
                          return int(start)

                  # Env expression with default, e.g. ${WG_PORT:-51820}
                  if token.startswith('${') and token.endswith('}'):
                      inner = token[2:-1]
                      default = None
                      if ':-' in inner:
                          default = inner.split(':-', 1)[1]
                      elif '-' in inner:
                          default = inner.split('-', 1)[1]
                      if default and default.isdigit():
                          return int(default)

                  # Fallback regex for env/default patterns
                  match = re.search(r':-([0-9]+)', token)
                  if match:
                      return int(match.group(1))

                  return None

              def extract_published_port(port_spec):
                  def split_outside_context(s):
                      parts = []
                      buf = []
                      env_depth = 0
                      ipv6_depth = 0
                      i = 0

                      while i < len(s):
                          ch = s[i]

                          # Enter ${...} env expression
                          if ch == '$' and i + 1 < len(s) and s[i + 1] == '{':
                              env_depth += 1
                              buf.append(ch)
                              buf.append('{')
                              i += 2
                              continue

                          if ch == '}' and env_depth > 0:
                              env_depth -= 1
                              buf.append(ch)
                              i += 1
                              continue

                          # Track IPv6 host brackets
                          if ch == '[':
                              ipv6_depth += 1
                              buf.append(ch)
                              i += 1
                              continue

                          if ch == ']' and ipv6_depth > 0:
                              ipv6_depth -= 1
                              buf.append(ch)
                              i += 1
                              continue

                          # Split only on ':' outside env/ipv6 context
                          if ch == ':' and env_depth == 0 and ipv6_depth == 0:
                              parts.append(''.join(buf))
                              buf = []
                              i += 1
                              continue

                          buf.append(ch)
                          i += 1

                      parts.append(''.join(buf))
                      return parts

                  # Handles short syntax:
                  # "8080:80", "127.0.0.1:8080:80", "${PORT:-8080}:80", "51820:51820/udp"
                  spec = str(port_spec).strip()
                  if not spec:
                      return None

                  parts = split_outside_context(spec)
                  if len(parts) == 1:
                      candidate = parts[0]
                  elif len(parts) == 2:
                      candidate = parts[0]
                  else:
                      # For host IP + host port + container port, use the second-to-last segment.
                      candidate = parts[-2]

                  return parse_port_token(candidate)

              ports = []
              if 'services' in content:
                  for svc in content['services'].values():
                      if 'ports' in svc:
                          for port in svc['ports']:
                              if isinstance(port, int):
                                  ports.append(port)
                              elif isinstance(port, str):
                                  parsed = extract_published_port(port)
                                  if parsed is not None:
                                      ports.append(parsed)
                              elif isinstance(port, dict):
                                  # Long syntax:
                                  # - target: 80
                                  #   published: 8080
                                  published = port.get('published')
                                  parsed = parse_port_token(published)
                                  if parsed is not None:
                                      ports.append(parsed)

              # Check for README
              readme_path = os.path.join(os.path.dirname(filepath), 'README.md')
              description = ""
              if os.path.exists(readme_path):
                  with open(readme_path, 'r') as f:
                      lines = f.readlines()
                      for line in lines[1:]:  # Skip title
                          line = line.strip()
                          if line and not line.startswith('#'):
                              description = line
                              break

              # Get env vars from .env.example
              env_vars = []
              env_example = os.path.join(os.path.dirname(filepath), '.env.example')
              if os.path.exists(env_example):
                  with open(env_example, 'r') as f:
                      for line in f:
                          line = line.strip()
                          if line and not line.startswith('#') and '=' in line:
                              env_vars.append(line.split('=')[0])

              return {
                  'category': category,
                  'entry': {
                      'name': name,
                      'path': rel_path,
                      'description': description,
                      'ports': sorted(set(ports)),
                      'requires': [],
                      'env_vars': env_vars
                  }
              }

          def main():
              registry = {
                  'version': '1.0.0',
                  'infrastructure': [],
                  'services': []
              }

              compose_files = find_compose_files()

              for filepath in compose_files:
                  result = parse_compose(filepath)
                  if result:
                      registry[result['category']].append(result['entry'])

              # Sort by name
              registry['infrastructure'].sort(key=lambda x: x['name'])
              registry['services'].sort(key=lambda x: x['name'])

              with open('registry.json', 'w') as f:
                  json.dump(registry, f, indent=2)

              print("Registry updated!")
              print(f"  Infrastructure: {len(registry['infrastructure'])}")
              print(f"  Services: {len(registry['services'])}")

          if __name__ == '__main__':
              main()
          EOF

      - name: Commit registry changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --staged --quiet || git commit -m "Update registry.json [skip ci]"
          git push || echo "Nothing to push"
